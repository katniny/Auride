name: Deploy to Cloudflare Pages & Build Apps
on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  deploy:
    name: Deploy Web
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/rewrite'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Check for web changes
        id: web_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'

      - name: Setup Node
        if: steps.web_changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install dependencies
        if: steps.web_changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install
        working-directory: ./web
      
      - name: Write .env file
        if: steps.web_changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          printf "%s" "${{ secrets.CANARY_ENV_FILE }}" > ./web/.env
      
      - name: Build project
        if: steps.web_changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build
        working-directory: ./web
      
      - name: Deploy to Cloudflare Pages
        if: steps.web_changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: ./web
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=auride
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/rewrite'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install web dependencies
        run: npm install
        working-directory: ./web
      
      - name: Write .env file
        run: |
          printf "%s" "${{ secrets.CANARY_ENV_FILE }}" > ./web/.env
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install app dependencies
        run: npm install
        working-directory: ./apps

      - name: Setup Android signing
        run: |
          cd ./apps/src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
      
      - name: Setup JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      
      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
      
      - name: Build Web
        run: npm run build:web -- --headless
        working-directory: ./apps
      
      - name: Build Android APK
        run: npm run tauri android build -- --apk
        working-directory: ./apps
      
      - name: Rename APK
        run: mv ./apps/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ./auride.apk
      
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: auride-android
          path: ./auride.apk
  
  build-windows-intel:
    name: Build Windows (x86_64)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/rewrite'
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install web dependencies
        run: npm install
        working-directory: ./web
      
      - name: Write .env file
        shell: pwsh
        run: Set-Content -Path ./web/.env -Value $env:CANARY_ENV_FILE
        env:
          CANARY_ENV_FILE: ${{ secrets.CANARY_ENV_FILE }}

      - name: Install app dependencies
        run: npm install
        working-directory: ./apps
      
      - name: Build Web
        run: npm run build:web -- --headless
        working-directory: ./apps
      
      - name: Build Windows Installer
        run: npm run tauri build
        working-directory: ./apps
      
      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: auride-windows-msi
          path: ./apps/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      
      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        with:
          name: auride-windows-nsis
          path: ./apps/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  
  build-linux-intel:
    name: Build Linux (x86_64)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/rewrite'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      
      - name: Install web dependencies
        run: npm install
        working-directory: ./web
      
      - name: Write .env file
        run: printf "%s" "${{ secrets.CANARY_ENV_FILE }}" > ./web/.env

      - name: Install app dependencies
        run: npm install
        working-directory: ./apps
      
      - name: Build Web
        run: npm run build:web -- --headless
        working-directory: ./apps
      
      - name: Build Linux
        run: npm run tauri build
        working-directory: ./apps
      
      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: auride-linux-debian
          path: ./apps/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: auride-linux-debian
          path: ./apps/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      
      - name: Upload Linux RPM
        uses: actions/upload-artifact@v4
        with:
          name: auride-linux-fedora
          path: ./apps/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error